[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-test-analyzer"
version = "1.0.0"
description = "Reproducible simulated instrument testing, measurement analysis, and reporting"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
instrument-analyzer = "analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
